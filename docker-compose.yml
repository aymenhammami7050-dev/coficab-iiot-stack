services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: coficab-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  plc-simulator:
    build: .
    container_name: coficab-plc-simulator
    depends_on:
      - mosquitto
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    container_name: coficab-nodered
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
  influxdb:
    image: influxdb:2.7
    container_name: coficab-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=coficab2026
      - DOCKER_INFLUXDB_INIT_ORG=coficab
      - DOCKER_INFLUXDB_INIT_BUCKET=surpresseur
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=coficab-admin-token-2026
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: coficab-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped
